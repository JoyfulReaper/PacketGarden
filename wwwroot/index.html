<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacketGarden</title>
  <link rel="stylesheet" href="garden.css">
  <script src="garden-audio.js" defer></script>
  <script src="garden.js" defer></script>
</head>
<body>
  <header>
    <h1>PacketGarden</h1>
    <p>A quiet patch of possibility.</p>
  </header>
  <main aria-label="Garden">
    <canvas aria-label="An empty rectangular soil garden with a subtle square grid" role="img">
      An empty rectangular soil garden with a subtle square grid.
    </canvas>
  </main>
  <div class="weather-controls" aria-label="Temporary weather controls">
    <label for="weather-source">Weather source</label>
    <select id="weather-source">
      <option value="manual">Manual</option>
      <option value="live" selected>Live</option>
    </select>
    <label for="weather-level">Weather</label>
    <select id="weather-level">
      <option value="quiet">Quiet</option>
      <option value="drizzle">Drizzle</option>
      <option value="rain">Rain</option>
      <option value="heavy_rain">Heavy rain</option>
      <option value="botnet_thunderstorm">Botnet thunderstorm</option>
      <option value="botnet_hurricane">Botnet hurricane</option>
    </select>
    <label for="weather-intensity">Events/min</label>
    <input id="weather-intensity" type="number" min="0" max="1000000" step="100" value="1200">
    <span id="weather-status" role="status">Live weather connecting</span>
  </div>
  <div class="sound-controls" aria-label="Garden sound controls">
    <button id="sound-toggle" type="button" aria-pressed="false">Sound: Off</button>
    <label for="sound-volume">Volume</label>
    <input id="sound-volume" type="range" min="0" max="100" value="12" aria-label="Growth sound volume">
  </div>
  <footer aria-label="Temporary development controls">
    <button id="fake-dns" type="button">Generate fake DNS event</button>
    <button id="fake-gopher" type="button">Generate fake Gopher event</button>
    <button id="fake-http" type="button">Generate fake HTTP event</button>
    <button id="fake-ssh" type="button">Generate fake SSH event</button>
    <button id="fake-port22-probe" type="button">Fake port 22 probe</button>
    <button id="automatic-traffic" type="button" aria-pressed="false">Start automatic fake traffic</button>
    <span id="garden-status" role="status">0 flowers, 0 mushrooms, 0 broad-leaf plants, 0 vines, 0 red blooms</span>
  </footer>
</body>
</html>
