<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PacketGarden</title>
  <link rel="stylesheet" href="garden.css">
  <link rel="stylesheet" href="garden-ui.css">
  <link rel="stylesheet" href="pixi-live.css?v=phase1b-1">
  <script src="vendor/pixi/pixi.min.js" defer></script>
  <script src="pixi-stress.js" defer data-pixi-library></script>
  <script src="garden-core.js" defer></script>
  <script src="garden-mutations.js" defer></script>
  <script src="garden-ecology.js" defer></script>
  <script src="garden-ambient.js" defer></script>
  <script src="garden-interaction.js" defer></script>
  <script src="garden-ui-core.js" defer></script>
  <script src="pixi-live-ui.js" defer></script>
  <script src="pixi-live-ambient.js" defer></script>
  <script src="pixi-live-ecology.js?v=grass-art-2c-1" defer></script>
  <script src="pixi-live-core.js" defer></script>
  <script src="pixi-live.js?v=plant-art-2b-1" defer></script>
</head>
<body class="pixi-default">
  <header>
    <h1>PacketGarden</h1>
    <p>Packet Garden: Composting the internet's shit into something pretty.</p>
    <nav class="site-nav" aria-label="Site navigation">
      <a href="about.html">About</a> · <a href="canvas.html">Canvas garden</a>
    </nav>
  </header>
  <main aria-label="Garden">
    <div class="pixi-garden-stage">
      <div id="view" aria-label="PacketGarden"></div>
    </div>
    <div id="collection-message" class="collection-message" role="status" hidden></div>
    <section id="recent-activity" class="recent-activity" aria-label="Recent activity">
      <h2>Recent activity</h2>
      <ol>
        <li id="recent-event-0" hidden></li>
        <li id="recent-event-1" hidden></li>
        <li id="recent-event-2" hidden></li>
      </ol>
      <p id="garden-score">Score: 0</p>
    </section>
  </main>
  <aside id="specimen-card" class="specimen-card" aria-live="polite" hidden>
    <button id="specimen-card-close" class="specimen-card-close" type="button" aria-label="Close specimen information">×</button>
    <h2 id="specimen-card-title">Specimen</h2>
    <dl>
      <div><dt>Source</dt><dd id="specimen-source">—</dd></div>
      <div><dt>Sensor</dt><dd id="specimen-sensor">—</dd></div>
      <div><dt>Listening port</dt><dd id="specimen-port">—</dd></div>
      <div><dt>Seen count</dt><dd id="specimen-seen-count">—</dd></div>
      <div><dt>Vigor</dt><dd id="specimen-vigor">—</dd></div>
      <div><dt>Color scheme</dt><dd id="specimen-color">—</dd></div>
      <div><dt>Age</dt><dd id="specimen-age">—</dd></div>
      <div><dt>Mutation</dt><dd id="specimen-mutation">None</dd></div>
    </dl>
  </aside>
  <footer aria-label="Garden status">
    <span>Live connection: <span id="connection" role="status">connecting</span></span>
    <span id="weather-status" role="status">Live weather connecting</span>
    <label class="recent-activity-toggle" for="show-recent-activity">
      <input id="show-recent-activity" type="checkbox" checked>
      Recent events
    </label>
  </footer>
</body>
</html>
